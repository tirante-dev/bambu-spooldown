name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: bambu-spooldown
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q

  image:
    needs: check
    runs-on: bambu-spooldown
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t bambu-spooldown:ci .

  chart:
    runs-on: bambu-spooldown
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint and template
        run: |
          helm lint charts/bambu-spooldown \
            --set printer.host=192.0.2.1 --set printer.serial=TEST \
            --set spoolman.url=http://spoolman:8000 --set existingSecret=test
          helm template charts/bambu-spooldown \
            --set printer.host=192.0.2.1 --set printer.serial=TEST \
            --set spoolman.url=http://spoolman:8000 --set existingSecret=test >/dev/null
