name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: bambu-spooldown
    outputs:
      app_release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['bambu-spooldown--release_created'] }}
      app_version: ${{ steps.release.outputs.version || steps.release.outputs['bambu-spooldown--version'] }}
      chart_release_created: ${{ steps.release.outputs['charts/bambu-spooldown--release_created'] || steps.release.outputs['bambu-spooldown-chart--release_created'] }}
      chart_version: ${{ steps.release.outputs['charts/bambu-spooldown--version'] || steps.release.outputs['bambu-spooldown-chart--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-chart-app-version:
    name: Sync Chart App Version
    needs: release-please
    if: needs.release-please.outputs.app_release_created == 'true'
    runs-on: bambu-spooldown
    # The main ruleset has no bypass actors, so this cannot push to main; the
    # bump goes through a PR that merges itself once the required checks pass.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Push chart appVersion bump branch
        id: bump
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.app_version }}"
          sed -i "s/^appVersion: .*/appVersion: ${version}/" charts/bambu-spooldown/Chart.yaml
          if git diff --quiet; then
            echo "Chart appVersion is already ${version}; nothing to do"
            exit 0
          fi
          branch="chart-app-version/${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add charts/bambu-spooldown/Chart.yaml
          git commit -m "fix(helm): update chart app version to ${version}"
          git push --force origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open PR with auto-merge
        if: steps.bump.outputs.branch != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          script: |
            const version = "${{ needs.release-please.outputs.app_version }}";
            const head = "${{ steps.bump.outputs.branch }}";
            const { owner, repo } = context.repo;
            let [pr] = (await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${head}` })).data;
            if (!pr) {
              ({ data: pr } = await github.rest.pulls.create({
                owner, repo, head, base: "main",
                title: `fix(helm): update chart app version to ${version}`,
                body: `Chart appVersion follows the bambu-spooldown ${version} release. Merges itself once CI passes.`,
              }));
            }
            await github.graphql(
              `mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId } }`,
              { id: pr.node_id },
            );

  publish-image:
    name: Publish Image
    needs: release-please
    if: needs.release-please.outputs.app_release_created == 'true'
    runs-on: bambu-spooldown
    env:
      IMAGE: registry.ahkc.win/bambu-spooldown/bambu-spooldown
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: registry.ahkc.win
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and push
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.app_version }}"
          docker build -t "$IMAGE:$version" .
          docker tag "$IMAGE:$version" "$IMAGE:latest"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"

  publish-helm-chart:
    name: Publish Helm Chart
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: bambu-spooldown
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Login to Harbor
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "${REGISTRY_PASSWORD}" | helm registry login registry.ahkc.win -u "${REGISTRY_USERNAME}" --password-stdin
      - name: Package and push chart
        run: |
          set -euo pipefail
          app_version="$(jq -r '."."' .release-please-manifest.json)"
          helm package charts/bambu-spooldown \
            --version "${{ needs.release-please.outputs.chart_version }}" \
            --app-version "${app_version}"
          helm push "bambu-spooldown-${{ needs.release-please.outputs.chart_version }}.tgz" oci://registry.ahkc.win/bambu-spooldown/charts
