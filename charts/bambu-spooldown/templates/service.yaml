apiVersion: v1
kind: Service
metadata:
  name: {{ include "bambu-spooldown.fullname" . }}
  labels: {{ include "bambu-spooldown.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
