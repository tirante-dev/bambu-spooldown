[project]
name = "bambu-spooldown"
version = "0.4.0"
description = "Counts Bambu Lab print jobs down against Spoolman spool inventory"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "paho-mqtt>=2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spooldown"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RET", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "paho.mqtt.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
